<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision 2026 — Stencil Group</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
:root {
  /* Fondos */
  --bg: #F5F7FA;
  --bg-white: #FFFFFF;
  --bg-hover: #F0F2F5;

  /* Sidebar */
  --bg-sidebar: #1B2A4A;
  --sidebar-active: #2D4A7A;
  --sidebar-hover: #243556;
  --sidebar-text: #8FA4C4;
  --sidebar-text-active: #FFFFFF;

  /* Primario */
  --primary: #4C6EF5;
  --primary-hover: #3B5BDB;
  --primary-light: #EDF2FF;

  /* Legacy mappings (used by app.js and modules) */
  --card: #FFFFFF;
  --card2: #F8FAFC;
  --accent: #4C6EF5;
  --accent2: #3B5BDB;
  --green: #22C55E;
  --red: #EF4444;
  --yellow: #F59E0B;
  --orange: #F97316;
  --text: #1E293B;
  --muted: #64748B;
  --border: #E2E8F0;

  /* Semantic */
  --success: #22C55E;
  --success-light: #F0FDF4;
  --warning: #F59E0B;
  --warning-light: #FFFBEB;
  --danger: #EF4444;
  --danger-light: #FEF2F2;
  --info: #3B82F6;
  --info-light: #EFF6FF;

  /* Text */
  --text-primary: #1E293B;
  --text-secondary: #64748B;
  --text-muted: #94A3B8;
  --text-inverse: #FFFFFF;

  /* Borders */
  --border-hover: #CBD5E1;
  --border-focus: #4C6EF5;

  /* Typography */
  --font-family: 'Inter', system-ui, -apple-system, sans-serif;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07), 0 2px 4px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.08), 0 4px 6px rgba(0, 0, 0, 0.04);
  --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.1), 0 10px 10px rgba(0, 0, 0, 0.04);

  /* Radii */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* Transitions */
  --transition-fast: 0.15s ease;
  --transition-base: 0.2s ease;
  --transition-slow: 0.3s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-family); background: var(--bg); color: var(--text-primary); min-height: 100vh; }

/* ── Layout ── */
.shell { display: flex; min-height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  background: var(--bg-sidebar);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 200;
  transition: transform 0.25s ease, width 0.2s ease;
}
.sidebar.collapsed { width: 64px; }
.sidebar-collapse-btn {
  position: absolute;
  top: 18px;
  right: -10px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  background: var(--bg-sidebar);
  color: #FFFFFF;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  z-index: 201;
  transition: transform 0.2s ease, background 0.2s ease;
  padding: 0;
  line-height: 1;
}
.sidebar-collapse-btn:hover { background: var(--sidebar-active); transform: scale(1.1); }
.sidebar.collapsed .sidebar-collapse-btn { transform: rotate(180deg); }
.sidebar.collapsed .sidebar-collapse-btn:hover { transform: rotate(180deg) scale(1.1); }
.sidebar.collapsed .brand-text,
.sidebar.collapsed .nav-section-label,
.sidebar.collapsed .nav-item > *:not(.icon),
.sidebar.collapsed .nav-group-label > *:not(.icon),
.sidebar.collapsed .user-info { display: none !important; }
.sidebar.collapsed .sidebar-brand { padding: 16px 0; justify-content: center; }
.sidebar.collapsed .nav-item,
.sidebar.collapsed .nav-group-label { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .nav-sub { display: none !important; }
.sidebar.collapsed .sidebar-footer { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .nav-item:hover,
.sidebar.collapsed .nav-group-label:hover { position: relative; }
.sidebar.collapsed .nav-item:hover::after,
.sidebar.collapsed .nav-group-label:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 100%;
  margin-left: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: #1B2A4A;
  color: #fff;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 250;
}
.sidebar-brand {
  padding: 16px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  gap: 10px;
  height: 56px;
}
.sidebar-brand .brand-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #4C6EF5, #7C3AED);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.sidebar-brand .brand-text h2 {
  font-size: 14px;
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.2;
}
.sidebar-brand .brand-text .sub {
  font-size: 11px;
  color: var(--sidebar-text);
  margin-top: 1px;
}
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-section-label {
  padding: 20px 16px 8px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.4);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  color: var(--sidebar-text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  text-decoration: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
  border-left: 3px solid transparent;
}
.nav-item:hover { color: #FFFFFF; background: var(--sidebar-hover); }
.nav-item.active {
  color: #FFFFFF;
  background: var(--sidebar-active);
  border-left: 3px solid var(--primary);
}
.nav-item .icon { width: 20px; text-align: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.nav-item .icon svg { width: 16px; height: 16px; }
.nav-group-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  color: var(--sidebar-text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
  border-left: 3px solid transparent;
}
.nav-group-label:hover { color: #FFFFFF; background: var(--sidebar-hover); }
.nav-group-label .icon { width: 20px; text-align: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.nav-group-label .icon svg { width: 16px; height: 16px; }
.nav-group-label .arrow { margin-left: auto; font-size: 10px; transition: transform 0.2s; color: rgba(255,255,255,0.3); }
.nav-group-label.open .arrow { transform: rotate(90deg); }
.nav-sub { display: none; }
.nav-sub.open { display: block; }
.nav-sub .nav-item { padding-left: 46px; font-size: 12px; }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-footer .user-avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: var(--sidebar-active);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}
.sidebar-footer .user-info {
  font-size: 12px;
  color: var(--sidebar-text);
  line-height: 1.3;
}
.sidebar-footer .user-info .user-name {
  color: #FFFFFF;
  font-weight: 500;
}

/* ── Main content ── */
.main { flex: 1; margin-left: 220px; min-height: 100vh; display: flex; flex-direction: column; transition: margin-left 0.2s ease; }
body.sidebar-collapsed .main { margin-left: 64px; }
body.sidebar-collapsed .topbar { left: 64px; }
.topbar {
  position: fixed;
  top: 0;
  left: 220px;
  right: 0;
  height: 56px;
  transition: left 0.2s ease;
  z-index: 100;
  background: #FFFFFF;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
/* ── Brand Switcher (Workspaces) ── */
.brand-switcher { position: relative; display: flex; align-items: center; }
.brand-trigger {
  display: flex; align-items: center; gap: 6px;
  background: #F8FAFC; border: 1px solid var(--border, #E2E8F0); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; font: inherit; color: var(--text, #0F172A);
  transition: background 0.15s, border-color 0.15s;
}
.brand-trigger:hover { background: #F1F5F9; border-color: #CBD5E1; }
.brand-trigger .brand-label { color: #64748B; font-size: 12px; font-weight: 500; }
.brand-trigger .brand-name { font-size: 13px; font-weight: 600; }
.brand-trigger .brand-caret { color: #94A3B8; font-size: 10px; }
.brand-menu {
  position: absolute; top: calc(100% + 6px); right: 0;
  background: #FFFFFF; border: 1px solid var(--border, #E2E8F0); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
  min-width: 220px; padding: 6px; z-index: 200;
}
.brand-list { display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-y: auto; }
.brand-list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
  font-size: 13px; color: var(--text, #0F172A);
  transition: background 0.12s;
  border: none; background: transparent; text-align: left; width: 100%;
}
.brand-list-item:hover { background: #F1F5F9; }
.brand-list-item.active { background: #EFF6FF; color: #1D4ED8; font-weight: 600; }
.brand-list-item .check { color: #1D4ED8; }
.brand-divider { height: 1px; background: var(--border, #E2E8F0); margin: 6px 0; }
.brand-create-btn {
  width: 100%; padding: 8px 10px; border-radius: 6px;
  background: transparent; border: none; cursor: pointer;
  font-size: 13px; color: #1D4ED8; font-weight: 500; text-align: left;
  transition: background 0.12s;
}
.brand-create-btn:hover { background: #EFF6FF; }

/* Modal Crear marca */
.brand-modal { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; }
.brand-modal[hidden] { display: none; }
.brand-modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.5); }
.brand-modal-card {
  position: relative; background: #FFFFFF; border-radius: 12px;
  padding: 28px; max-width: 440px; width: calc(100% - 48px);
  box-shadow: 0 20px 48px rgba(15, 23, 42, 0.2);
}
.brand-modal-title { margin: 0 0 8px 0; font-size: 18px; font-weight: 600; color: #0F172A; }
.brand-modal-help { margin: 0 0 20px 0; font-size: 13px; color: #64748B; line-height: 1.5; }
.brand-modal-label { display: block; font-size: 12px; font-weight: 500; color: #475569; margin-bottom: 6px; }
.brand-modal-input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border, #E2E8F0); border-radius: 8px;
  font: inherit; font-size: 14px; color: #0F172A; box-sizing: border-box;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.brand-modal-input:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
.brand-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.brand-modal-cancel, .brand-modal-create {
  padding: 9px 18px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; border: 1px solid transparent; transition: all 0.15s;
}
.brand-modal-cancel { background: #FFFFFF; border-color: var(--border, #E2E8F0); color: #475569; }
.brand-modal-cancel:hover { background: #F8FAFC; }
.brand-modal-create { background: #2563EB; color: #FFFFFF; }
.brand-modal-create:hover:not(:disabled) { background: #1D4ED8; }
.brand-modal-create:disabled { opacity: 0.6; cursor: not-allowed; }

.topbar .breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}
.topbar .breadcrumb .bc-sep {
  color: var(--text-muted);
}
.topbar .breadcrumb .bc-current {
  color: var(--text-primary);
  font-weight: 600;
}
.hamburger {
  display: none;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  padding: 6px 10px;
  font-size: 1.2rem;
  cursor: pointer;
  margin-right: 12px;
}
.content-area {
  flex: 1;
  margin-top: 56px;
  padding: 24px;
  background: var(--bg);
  min-height: calc(100vh - 56px);
}

/* ── Overlay for mobile ── */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  z-index: 199;
}

/* ── Mobile ── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .main { margin-left: 0; }
  .topbar { left: 0; }
  .hamburger { display: block; }
  .content-area { margin-top: 56px; padding: 16px; }
}

/* ── Dashboard module light-theme overrides ── */
#dashboard-module .app{max-width:1400px;margin:0 auto;padding:16px}
#dashboard-module .header{text-align:center;padding:24px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
#dashboard-module .header h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,3vw,2.4rem);background:linear-gradient(135deg,#4C6EF5,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#dashboard-module .header p{color:var(--text-secondary);margin-top:4px;font-size:0.9rem}
#dashboard-module .tri-selector{display:flex;gap:6px;margin-bottom:12px;justify-content:center}
#dashboard-module .tri-btn{padding:10px 24px;border:2px solid var(--border);background:#FFFFFF;color:var(--text-secondary);cursor:pointer;border-radius:var(--radius-xl);font-size:0.9rem;font-weight:700;transition:all .2s;font-family:inherit}
#dashboard-module .tri-btn.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);box-shadow:0 0 12px rgba(76,110,245,.12)}
#dashboard-module .tri-btn:hover:not(.active){border-color:var(--border-hover);color:var(--text-primary);background:var(--bg-hover)}
#dashboard-module .tri-label{font-size:0.75rem;color:var(--text-secondary);font-weight:400}
#dashboard-module .nav{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;background:#FFFFFF;border-radius:var(--radius-xl);padding:4px;box-shadow:var(--shadow-xs);border:1px solid var(--border)}
#dashboard-module .nav button{padding:10px 16px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:var(--radius-lg);font-size:0.85rem;font-weight:600;transition:all .2s;font-family:inherit;white-space:nowrap}
#dashboard-module .nav button.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
#dashboard-module .nav button:hover:not(.active){color:var(--text-primary);background:var(--bg-hover)}
#dashboard-module .grid{display:grid;gap:16px}
#dashboard-module .g2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#dashboard-module .g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
#dashboard-module .g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
#dashboard-module .kpi-card{background:#FFFFFF;border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border);transition:all .25s;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
#dashboard-module .kpi-card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:var(--shadow-md)}
#dashboard-module .kpi-card .label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
#dashboard-module .kpi-card .value{font-size:clamp(1.4rem,2.5vw,1.8rem);font-weight:700;color:var(--text-primary)}
#dashboard-module .kpi-card .sub{font-size:0.78rem;color:var(--text-secondary);margin-top:4px}
#dashboard-module .kpi-card .accent{position:absolute;top:0;left:0;right:0;height:3px}
#dashboard-module .section{margin-bottom:24px}
#dashboard-module .section-title{font-size:1.1rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text-primary)}
#dashboard-module .badge{display:inline-block;padding:2px 8px;border-radius:var(--radius-full);font-size:11px;font-weight:600}
#dashboard-module .panel{background:#FFFFFF;border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm)}
#dashboard-module .panel-header{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;display:flex;justify-content:space-between;align-items:center;color:var(--text-primary)}
#dashboard-module .table-wrap{overflow-x:auto;max-height:600px;overflow-y:auto}
#dashboard-module table{width:100%;border-collapse:collapse;font-size:13px}
#dashboard-module th{background:#F8FAFC;padding:10px 12px;text-align:left;font-weight:600;color:var(--text-muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--border)}
#dashboard-module td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text-primary)}
#dashboard-module tr:hover td{background:var(--bg-hover)}
#dashboard-module .bar{height:8px;border-radius:4px;background:#E2E8F0;overflow:hidden;min-width:60px}
#dashboard-module .bar-fill{height:100%;border-radius:4px;transition:width .5s}
#dashboard-module .chip{display:inline-block;padding:3px 10px;border-radius:var(--radius-full);font-size:0.72rem;font-weight:600}
#dashboard-module .sem{font-size:1.3rem;text-align:center}
#dashboard-module .search-box{padding:10px 16px;background:#FFFFFF;border:1px solid var(--border);border-radius:var(--radius-lg);color:var(--text-primary);font-size:0.85rem;font-family:inherit}
#dashboard-module .search-box:focus{outline:none;border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(76,110,245,0.1)}
#dashboard-module .area-card{background:#FFFFFF;border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;transition:all .25s;box-shadow:var(--shadow-sm)}
#dashboard-module .area-card:hover{border-color:var(--border-hover);box-shadow:var(--shadow-md)}
#dashboard-module .area-header{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--text-primary)}
#dashboard-module .area-body{padding:0 18px 14px}
#dashboard-module .ini-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:0.83rem;color:var(--text-primary)}
#dashboard-module .ini-item:last-child{border-bottom:none}
#dashboard-module .tag{display:inline-block;padding:2px 6px;border-radius:var(--radius-sm);font-size:0.68rem;font-weight:600;margin-right:4px}
#dashboard-module .chart-bar-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#dashboard-module .chart-bar-h .bar-label{width:90px;font-size:0.78rem;text-align:right;color:var(--text-secondary);flex-shrink:0}
#dashboard-module .chart-bar-h .bar-track{flex:1;height:28px;background:#E2E8F0;border-radius:var(--radius-md);overflow:hidden;position:relative}
#dashboard-module .chart-bar-h .bar-value{height:100%;border-radius:var(--radius-md);display:flex;align-items:center;padding:0 10px;font-size:0.75rem;font-weight:600;color:#fff;transition:width .6s}
#dashboard-module .chart-bar-h .bar-amount{width:110px;font-size:0.82rem;font-weight:600;text-align:right;flex-shrink:0;color:var(--text-primary)}
#dashboard-module .back-btn{padding:6px 14px;border:1px solid var(--border);background:transparent;color:var(--primary);cursor:pointer;border-radius:var(--radius-lg);font-size:0.8rem;font-family:inherit;margin-bottom:12px}
#dashboard-module .back-btn:hover{background:var(--primary-light)}
#dashboard-module .money{color:var(--primary)}
#dashboard-module .money-gold{color:#B45309}
#dashboard-module .money-coral{color:#DC2626}
#dashboard-module .btn-inline{font-size:0.72rem;padding:4px 8px;border-radius:var(--radius-md);border:1px solid var(--border);background:#FFFFFF;color:var(--primary);cursor:pointer;font-family:inherit}

/* ── Toast (light theme) ── */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  background: #FFFFFF;
  box-shadow: var(--shadow-lg);
  border-left: 4px solid var(--info);
  animation: toastIn 0.25s ease, toastOut 0.25s ease 2.75s forwards;
  max-width: 360px;
}
.toast.success { border-left-color: var(--success); color: #15803D; }
.toast.error { border-left-color: var(--danger); color: #DC2626; }
.toast.info { border-left-color: var(--primary); color: var(--primary); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Colapsar barra lateral">&#10094;</button>
    <div class="sidebar-brand">

    <nav class="sidebar-nav">

        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>
        Dashboard Q1

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;">
        <button class="hamburger" id="hamburger">&#9776;</button>
        <div class="breadcrumb">

<!-- Modal: Crear nueva marca -->
<div class="brand-modal" id="brandModal" hidden>
  <div class="brand-modal-backdrop" id="brandModalBackdrop"></div>
  <div class="brand-modal-card">
    <h3 class="brand-modal-title">Crear nueva marca</h3>
    <p class="brand-modal-help">Cada marca es un workspace independiente. Empezarás con las 6 fases base vacías y construirás tu arquitectura comercial desde cero.</p>

      <button class="brand-modal-cancel" id="brandModalCancel" type="button">Cancelar</button>

    </div>
  </div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ── Workspaces (multi-marca): inyecta X-Brand-Id en cada fetch ── */
(function() {
  var KEY = 'active_brand_id';
  function getActiveBrandId() {
    var v = localStorage.getItem(KEY);
    var n = parseInt(v, 10);
    return (n && n > 0) ? n : 1;
  }
  window.__getActiveBrandId = getActiveBrandId;
  window.__setActiveBrandId = function(id) {
    localStorage.setItem(KEY, String(id));
  };

  // Wrapper global de fetch — todas las llamadas del frontend pasan por aquí
  // y reciben el header X-Brand-Id automáticamente.
  var originalFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    init = init || {};
    var headers = new Headers(init.headers || (input && input.headers) || {});
    if (!headers.has('X-Brand-Id')) {
      headers.set('X-Brand-Id', String(getActiveBrandId()));
    }
    init.headers = headers;
    return originalFetch(input, init);
  };
})();

/* ── Toast util (global) ── */
window.__toast = function(msg, type) {
  type = type || 'info';
  // En fullscreen, el toastContainer global queda oculto; montamos toasts dentro del elemento fullscreen.
  var fsHost = document.fullscreenElement;
  var c;
  if (fsHost) {
    c = fsHost.querySelector('.toast-container--fs');
    if (!c) {
      c = document.createElement('div');
      c.className = 'toast-container toast-container--fs';
      c.style.position = 'fixed';
      c.style.top = '20px';
      c.style.right = '20px';
      c.style.zIndex = '99999';
      fsHost.appendChild(c);
    }
  } else {
    c = document.getElementById('toastContainer');
  }
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3100);
};

/* ── Router ── */
(function() {
  var currentModule = null;

  // Sidebar toggle (gastos oculto: null-guard por si el botón no está en el DOM)
  var gastosToggle = document.getElementById('gastosToggle');
  var gastosSub = document.getElementById('gastosSub');
  if (gastosToggle && gastosSub) {
    gastosToggle.addEventListener('click', function() {
      gastosToggle.classList.toggle('open');
      gastosSub.classList.toggle('open');
    });
  }

  // Sidebar collapse (desktop)
  var collapseBtn = document.getElementById('sidebarCollapseBtn');
  var sidebarEl = document.getElementById('sidebar');
  function applyCollapsed(on) {
    if (on) {
      sidebarEl.classList.add('collapsed');
      document.body.classList.add('sidebar-collapsed');
      collapseBtn.title = 'Expandir barra lateral';
    } else {
      sidebarEl.classList.remove('collapsed');
      document.body.classList.remove('sidebar-collapsed');
      collapseBtn.title = 'Colapsar barra lateral';
    }
  }
  try {
    if (localStorage.getItem('sidebar.collapsed') === '1') applyCollapsed(true);
  } catch(e) {}
  collapseBtn.addEventListener('click', function() {
    var willCollapse = !sidebarEl.classList.contains('collapsed');
    applyCollapsed(willCollapse);
    try { localStorage.setItem('sidebar.collapsed', willCollapse ? '1' : '0'); } catch(e) {}
    // notify modules so canvas/tables can re-measure
    window.dispatchEvent(new Event('resize'));
  });

  // Mobile hamburger
  var hamburger = document.getElementById('hamburger');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  hamburger.addEventListener('click', function() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
  });
  overlay.addEventListener('click', function() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  });

  // Nav clicks
  document.querySelectorAll('.nav-item[data-route]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      window.location.hash = btn.dataset.route.replace('#', '');
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    });
  });

  function updateActiveNav(hash) {
    document.querySelectorAll('.nav-item[data-route]').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.route === '#' + hash);
    });
    // Auto-open gastos sub if a gastos route is active
    if (hash === '/gastos' || hash === '/escenarios') {
      gastosToggle.classList.add('open');
      gastosSub.classList.add('open');
    }
  }

  function destroyCurrent() {
    if (currentModule === 'dashboard') {
      // React root will be destroyed when we clear content.innerHTML below
    } else if (currentModule === 'gastos' && window.GastosModule) {
      window.GastosModule.destroy();
    } else if (currentModule === 'escenarios' && window.EscenariosModule) {
      window.EscenariosModule.destroy();
    } else if (currentModule === 'simulador' && window.SimuladorModule) {
      window.SimuladorModule.destroy();
    } else if (currentModule === 'comercial' && window.ComercialModule) {
      window.ComercialModule.destroy();
    }
    currentModule = null;
  }

  function route() {
    var hash = window.location.hash.replace('#', '') || '/comercial';
    var content = document.getElementById('contentArea');
    var pageTitle = document.getElementById('pageTitle');

    destroyCurrent();
    content.innerHTML = '';

    updateActiveNav(hash);

    if (hash === '/dashboard') {
      pageTitle.textContent = 'Dashboard Q1';
      var wrapper = document.createElement('div');
      wrapper.id = 'dashboard-module';
      var rootDiv = document.createElement('div');
      rootDiv.id = 'root';
      wrapper.appendChild(rootDiv);
      content.appendChild(wrapper);

      // Load app.js fresh — use fetch + Function to execute in a new scope
      // so that top-level const/let declarations don't clash on re-load
      currentModule = 'dashboard';
      fetch('/app.js?t=' + Date.now())
        .then(function(r) { return r.text(); })
        .then(function(code) {
          // Only mount if we're still on the dashboard route
          if (currentModule !== 'dashboard') return;
          // Execute in a function scope to avoid const/let redeclaration errors
          new Function(code)();
        });

    } else if (hash === '/gastos') {
      pageTitle.textContent = 'Configurador de Gastos';
      var container = document.createElement('div');
      container.id = 'gastos-container';
      content.appendChild(container);
      // Load module if not already loaded
      if (window.GastosModule) {
        window.GastosModule.init(container);
        currentModule = 'gastos';
      } else {
        var s = document.createElement('script');
        s.src = '/gastos.js';
        s.onload = function() {
          window.GastosModule.init(container);
          currentModule = 'gastos';
        };
        document.body.appendChild(s);
      }

    } else if (hash === '/escenarios') {
      pageTitle.textContent = 'Escenarios';
      var container = document.createElement('div');
      container.id = 'escenarios-container';
      content.appendChild(container);
      if (window.EscenariosModule) {
        window.EscenariosModule.init(container);
        currentModule = 'escenarios';
      } else {
        var s = document.createElement('script');
        s.src = '/escenarios.js';
        s.onload = function() {
          window.EscenariosModule.init(container);
          currentModule = 'escenarios';
        };
        document.body.appendChild(s);
      }

    } else if (hash === '/simulador') {
      pageTitle.textContent = 'Simulador de Ingresos';
      var container = document.createElement('div');
      container.id = 'simulador-container';
      content.appendChild(container);
      if (window.SimuladorModule) {
        window.SimuladorModule.init(container);
        currentModule = 'simulador';
      } else {
        var s = document.createElement('script');
        s.src = '/simulador.js';
        s.onload = function() {
          window.SimuladorModule.init(container);
          currentModule = 'simulador';
        };
        document.body.appendChild(s);
      }

    } else if (hash === '/comercial') {
      pageTitle.textContent = 'Arquitectura Comercial';
      var container = document.createElement('div');
      container.id = 'comercial-container';
      content.appendChild(container);
      if (window.ComercialModule) {
        window.ComercialModule.init(container);
        currentModule = 'comercial';
      } else {
        var s = document.createElement('script');
        s.src = '/comercial.js';
        s.onload = function() {
          window.ComercialModule.init(container);
          currentModule = 'comercial';
        };
        document.body.appendChild(s);
      }

    } else {
      // fallback: solo Arquitectura Comercial está habilitada
      window.location.hash = '#/comercial';
      return;
    }
  }

  window.addEventListener('hashchange', route);

  // Set default hash if none
  if (!window.location.hash || window.location.hash === '#' || window.location.hash === '#/') {
    window.location.hash = '#/comercial';
  } else {
    // Si entra por #/dashboard, #/gastos, #/escenarios o #/simulador (módulos ocultos), redirige a comercial
    var h = window.location.hash.replace('#', '');
    if (h === '/dashboard' || h === '/gastos' || h === '/escenarios' || h === '/simulador') {
      window.location.hash = '#/comercial';
    } else {
      route();
    }
  }
})();

/* ── Brand Switcher (Workspaces) ── */
(function() {
  var trigger = document.getElementById('brandTrigger');
  var menu = document.getElementById('brandMenu');
  var nameEl = document.getElementById('brandActiveName');
  var listEl = document.getElementById('brandList');
  var createBtn = document.getElementById('brandCreateBtn');
  var modal = document.getElementById('brandModal');
  var modalBackdrop = document.getElementById('brandModalBackdrop');
  var modalCancel = document.getElementById('brandModalCancel');
  var modalCreate = document.getElementById('brandModalCreate');
  var modalInput = document.getElementById('brandModalName');

  if (!trigger || !menu) return;

  var brands = [];

  function loadBrands() {
    return fetch('/api/brands/').then(function(r) {
      if (!r.ok) throw new Error('No se pudieron cargar las marcas (' + r.status + ')');
      return r.json();
    }).then(function(data) {
      brands = data || [];
      renderActive();
      renderList();
    }).catch(function(err) {
      console.error('Brands load error', err);
      // No mostrar toast en boot inicial — degradar silenciosamente
    });
  }

  function renderActive() {
    var activeId = window.__getActiveBrandId();
    var match = brands.find(function(b) { return b.id === activeId; });
    if (!match && brands.length > 0) {
      // ID guardada ya no existe — caer a la primera
      window.__setActiveBrandId(brands[0].id);
      match = brands[0];
    }
    nameEl.textContent = match ? match.name : 'Promoselect';
  }

  function renderList() {
    var activeId = window.__getActiveBrandId();
    listEl.innerHTML = '';
    brands.forEach(function(b) {
      var btn = document.createElement('button');
      btn.className = 'brand-list-item' + (b.id === activeId ? ' active' : '');
      btn.type = 'button';
      btn.innerHTML = '<span>' + escapeHtml(b.name) + '</span>' + (b.id === activeId ? '<span class="check">&#10003;</span>' : '');
      btn.addEventListener('click', function() { switchBrand(b.id); });
      listEl.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function switchBrand(newId) {
    if (newId === window.__getActiveBrandId()) {
      closeMenu();
      return;
    }
    window.__setActiveBrandId(newId);
    // Reload completo: el módulo comercial cachea bootstrap en memoria, lo limpio.
    window.location.reload();
  }

  function openMenu() { menu.hidden = false; }
  function closeMenu() { menu.hidden = true; }

  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    if (menu.hidden) {
      renderList();
      openMenu();
    } else {
      closeMenu();
    }
  });

  document.addEventListener('click', function(e) {
    if (!menu.hidden && !menu.contains(e.target) && !trigger.contains(e.target)) {
      closeMenu();
    }
  });

  // ── Modal Crear marca ──
  function openModal() {
    closeMenu();
    modal.hidden = false;
    modalInput.value = '';
    setTimeout(function() { modalInput.focus(); }, 50);
  }
  function closeModal() { modal.hidden = true; }

  createBtn.addEventListener('click', openModal);
  modalCancel.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', closeModal);
  modalInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doCreate();
    if (e.key === 'Escape') closeModal();
  });
  modalCreate.addEventListener('click', doCreate);

  function doCreate() {
    var name = modalInput.value.trim();
    if (!name) {
      modalInput.focus();
      return;
    }
    modalCreate.disabled = true;
    modalCreate.textContent = 'Creando…';
    fetch('/api/brands/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error(t || ('HTTP ' + r.status)); });
      return r.json();
    }).then(function(newBrand) {
      window.__toast('Marca "' + newBrand.name + '" creada', 'success');
      window.__setActiveBrandId(newBrand.id);
      closeModal();
      // Reload para entrar a la marca nueva limpia
      setTimeout(function() { window.location.reload(); }, 300);
    }).catch(function(err) {
      console.error(err);
      window.__toast('Error al crear marca: ' + err.message.slice(0, 80), 'error');
      modalCreate.disabled = false;
      modalCreate.textContent = 'Crear marca';
    });
  }

  // Boot: cargar marcas
  loadBrands();
})();
</script>
</body>
